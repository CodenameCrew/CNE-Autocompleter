name: build dev vsix

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: node bundle.js --production
      - run: npx vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: CNE-Autocompleter-Dev
          path: "*.vsix"
